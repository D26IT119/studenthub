<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Register | StudentHub</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <header>
        <p class="site-name">StudentHub</p>
        <nav aria-label="Main navigation"><ul><li><a href="index.html">Home</a></li><li><a href="about.html">About</a></li><li><a href="register.html" aria-current="page">Register</a></li><li><a href="login.html">Login</a></li><li><a href="dashboard.html">Dashboard</a></li><li><a href="events.html">Events</a></li><li><a href="profile.html">Profile</a></li><li><a href="contact.html">Contact</a></li><li><a href="admin.html">Admin</a></li><li><a href="faq.html">FAQ</a></li><li><a href="feedback.html">Feedback</a></li></ul></nav>
    </header>
    <main>
        <h1>Start your StudentHub journey</h1>
        <p>Set up your account to keep up with campus updates and events.</p>
        <form class="form-box">
            <div class="form-grid">
                <div><label for="name">Full name</label><input id="name" name="name" autocomplete="name" required></div>
                <div><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" required></div>
                <div><label for="course">Course</label><select id="course" name="course"><option>IT</option><option>Computer Science</option><option>Other</option></select></div>
                <div><label for="year">Year</label><select id="year" name="year"><option>1st Year</option><option>2nd Year</option><option>3rd Year</option></select></div>
                <div class="full"><label for="password">Password</label><input id="password" name="password" type="password" minlength="6" required></div>
            </div>
            <button class="button" type="submit">Create account</button>
        </form>
    </main>
    <footer>&copy; 2026 StudentHub</footer>
    <script src="../js/script.js"></script>
</body>
</html>
